[metadata]
name = agent-hygiene
version = 0.4.1
description = Fast repo hygiene checks for AI coding agents, AGENTS.md, MCP configs, and agentic CI workflows.
long_description = file: README.md
long_description_content_type = text/markdown
author = agent-hygiene contributors
url = https://github.com/Yuki9814/agent-hygiene
project_urls =
    Issues = https://github.com/Yuki9814/agent-hygiene/issues
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Topic :: Security
    Topic :: Software Development :: Quality Assurance

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    agent-hygiene = agent_hygiene.cli:main

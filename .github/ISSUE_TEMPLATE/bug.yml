name: Bug report
description: Report a reproducible scanner, CLI, or reporter defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include live credentials, private prompts, or confidential repository content.
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a sanitized fixture and the command you ran.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agent-hygiene version
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and output format
      description: Include flags, exit code, and whether JSON or SARIF was requested.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation source
      options:
        - GitHub release wheel
        - Source checkout
        - GitHub Action
        - Other
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Fixture safety
      options:
        - label: I replaced all secrets and private content with synthetic values.
          required: true

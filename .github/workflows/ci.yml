name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q src tools
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests

  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Evaluate synthetic corpus
        run: PYTHONPATH=src python -m agent_hygiene evaluate tests/corpus/manifest.json
      - name: Validate canonical public evidence
        run: PYTHONPATH=src python -m agent_hygiene evidence evidence/v0.4.0 --format json
      - name: Scan this repository
        run: PYTHONPATH=src python -m agent_hygiene scan . --min-score 85 --fail-on high

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Run the action from this checkout
        id: hygiene
        uses: ./
        with:
          min-score: "85"
          fail-on: high
          json: agent-hygiene-action.json
          sarif: agent-hygiene-action.sarif
      - name: Verify portable maintainer handoff
        env:
          JSON_PATH: ${{ steps.hygiene.outputs.json }}
          SARIF_PATH: agent-hygiene-action.sarif
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python -I - "$JSON_PATH" "$SARIF_PATH" "$EXPECTED_REVISION" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          sarif = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          summary = payload["summary"]
          assert "root" not in summary
          assert summary["source_revision"] == sys.argv[3]
          assert len(summary["scope_fingerprint"]) == 20
          assert sarif["runs"][0]["properties"]["sourceRevision"] == sys.argv[3]
          PY

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Enforce the release 100k-file performance contract
        run: PYTHONPATH=src python tools/benchmark_large_repo.py --format json

  package:
    needs: [test, evidence, action, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build distributions
        run: |
          python -m pip install build==1.2.2.post1
          python -m build
      - name: Smoke-test wheel
        run: |
          python -m venv .package-smoke
          .package-smoke/bin/python -m pip install --no-index dist/*.whl
          .package-smoke/bin/agent-hygiene --version

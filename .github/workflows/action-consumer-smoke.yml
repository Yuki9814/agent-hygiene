name: Published Action smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run the published v0.7.0 action
        id: hygiene
        uses: Yuki9814/agent-hygiene@v0.7.0
        with:
          min-score: "85"
          fail-on: high
          json: agent-hygiene-action.json
          sarif: agent-hygiene-action.sarif
      - name: Verify published portable handoff
        env:
          JSON_PATH: ${{ steps.hygiene.outputs.json }}
          SARIF_PATH: agent-hygiene-action.sarif
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python -I - "$JSON_PATH" "$SARIF_PATH" "$EXPECTED_REVISION" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          sarif = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          summary = payload["summary"]
          assert "root" not in summary
          assert summary["source_revision"] == sys.argv[3]
          assert len(summary["scope_fingerprint"]) == 20
          assert sarif["runs"][0]["properties"]["sourceRevision"] == sys.argv[3]
          PY

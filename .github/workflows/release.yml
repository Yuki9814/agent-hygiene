name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Yuki9814/agent-hygiene'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify tag matches package version
        run: |
          PYTHONPATH=src python - <<'PY'
          import os
          import re
          from agent_hygiene import __version__

          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", __version__):
              raise SystemExit(f"package version is not a stable release: {__version__!r}")
          expected = f"v{__version__}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match {expected!r}")
          PY
      - name: Test release source
        run: |
          PYTHONPATH=src python -m unittest discover -s tests
          PYTHONPATH=src python -m agent_hygiene evaluate tests/corpus/manifest.json
          PYTHONPATH=src python -m agent_hygiene scan . --min-score 85 --fail-on high
      - name: Build distributions and checksums
        run: |
          python -m pip install build==1.2.2.post1
          python -m build
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --no-index dist/*.whl
          test "$(.release-smoke/bin/agent-hygiene --version)" = \
            "agent-hygiene ${RELEASE_TAG#v}"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          (cd dist && shasum -a 256 agent_hygiene-* > SHA256SUMS)
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  github-release:
    needs: verify
    if: github.repository == 'Yuki9814/agent-hygiene'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment: release
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Verify artifact names and checksums
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          wheel="dist/agent_hygiene-${version}-py3-none-any.whl"
          sdist="dist/agent_hygiene-${version}.tar.gz"
          checksums="dist/SHA256SUMS"
          test -f "$wheel"
          test -f "$sdist"
          test -f "$checksums"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "dist/agent_hygiene-${version}-py3-none-any.whl" \
            "dist/agent_hygiene-${version}.tar.gz" \
            "dist/SHA256SUMS" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes

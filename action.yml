name: agent-hygiene
description: Scan agent instruction files, MCP configs, and agentic workflows.
author: agent-hygiene contributors

inputs:
  path:
    description: Path to scan.
    required: false
    default: "."
  min-score:
    description: Minimum hygiene score required to pass.
    required: false
    default: "85"
  fail-on:
    description: Lowest severity that fails the run. Use none, low, medium, high, or critical.
    required: false
    default: high
  sarif:
    description: Optional SARIF output path.
    required: false
    default: ""
  baseline:
    description: Optional agent-hygiene baseline path.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate action inputs
      id: validate
      shell: bash
      env:
        AGENT_HYGIENE_INPUT_PATH: ${{ inputs.path }}
        AGENT_HYGIENE_INPUT_MIN_SCORE: ${{ inputs.min-score }}
        AGENT_HYGIENE_INPUT_FAIL_ON: ${{ inputs.fail-on }}
        AGENT_HYGIENE_INPUT_SARIF: ${{ inputs.sarif }}
        AGENT_HYGIENE_INPUT_BASELINE: ${{ inputs.baseline }}
      run: python -I "$GITHUB_ACTION_PATH/tools/validate_action_inputs.py" "$GITHUB_OUTPUT"
    - name: Install agent-hygiene
      shell: bash
      run: python -I -m pip install "$GITHUB_ACTION_PATH"
    - name: Scan agent surfaces
      shell: bash
      env:
        AGENT_HYGIENE_PATH: ${{ steps.validate.outputs.path }}
        AGENT_HYGIENE_MIN_SCORE: ${{ steps.validate.outputs.min_score }}
        AGENT_HYGIENE_FAIL_ON: ${{ steps.validate.outputs.fail_on }}
        AGENT_HYGIENE_SARIF: ${{ steps.validate.outputs.sarif }}
        AGENT_HYGIENE_BASELINE: ${{ steps.validate.outputs.baseline }}
      run: |
        set -euo pipefail
        BASELINE_ARGS=()
        if [ -n "$AGENT_HYGIENE_BASELINE" ]; then
          BASELINE_ARGS+=(--baseline "$AGENT_HYGIENE_BASELINE")
        fi
        if [ -n "$AGENT_HYGIENE_SARIF" ]; then
          agent-hygiene scan "$AGENT_HYGIENE_PATH" \
            --format sarif \
            --output "$AGENT_HYGIENE_SARIF" \
            --min-score 0 \
            --fail-on none \
            "${BASELINE_ARGS[@]}"
        fi
        agent-hygiene scan "$AGENT_HYGIENE_PATH" \
          --min-score "$AGENT_HYGIENE_MIN_SCORE" \
          --fail-on "$AGENT_HYGIENE_FAIL_ON" \
          "${BASELINE_ARGS[@]}"

branding:
  icon: shield
  color: blue

[build-system]
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hygiene"
version = "0.4.0"
description = "Fast repo hygiene checks for AI coding agents, AGENTS.md, MCP configs, and agentic CI workflows."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "agent-hygiene contributors" }]
keywords = [
  "ai-agents",
  "agents-md",
  "claude",
  "codex",
  "mcp",
  "security",
  "sarif",
  "github-actions"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance"
]

[project.urls]
Homepage = "https://github.com/Yuki9814/agent-hygiene"
Issues = "https://github.com/Yuki9814/agent-hygiene/issues"
Changelog = "https://github.com/Yuki9814/agent-hygiene/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Yuki9814/agent-hygiene#readme"
Repository = "https://github.com/Yuki9814/agent-hygiene"

[project.scripts]
agent-hygiene = "agent_hygiene.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
